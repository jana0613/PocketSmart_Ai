{% extends 'base.html' %}{% block title %}Jewelry Planner{% endblock %}{% block content %}<main class="container"><h1>Jewelry Budget Planner</h1><div class="panel"><form id="jewelryForm" class="form" enctype="multipart/form-data"><div class="row"><label>Budget<input id="budget" type="number" min="1" required></label><label>Occasion<input id="occasion" placeholder="Wedding, festival, party" required></label></div><div class="row"><label>Style<input id="style" value="Elegant"></label><label>Metal<input id="metal" value="Any"></label></div><label>Outfit notes<textarea id="outfit_notes" placeholder="Colors, neckline, overall style"></textarea></label><label>Optional outfit image<input id="outfit_image" type="file" accept="image/jpeg,image/png,image/webp"></label><button class="btn">Generate recommendations</button></form></div><div id="result"></div></main><script>requireAuth();jewelryForm.onsubmit=async e=>{e.preventDefault();try{const fd=new FormData();fd.append('budget',budget.value);fd.append('currency','INR');fd.append('occasion',occasion.value);fd.append('style',style.value);fd.append('metal',metal.value);fd.append('outfit_notes',outfit_notes.value);if(outfit_image.files[0])fd.append('outfit_image',outfit_image.files[0]);renderResult('#result',await api('/api/planners/jewelry',{method:'POST',body:fd}))}catch(x){result.innerHTML=`<p class="error">${escapeHtml(x.message)}</p>`}}</script>{% endblock %}
