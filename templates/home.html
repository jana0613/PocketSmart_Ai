{% extends 'base.html' %}{% block title %}Home Planner{% endblock %}{% block content %}<main class="container"><h1>Home Interior Planner</h1><div class="panel"><form id="homeForm" class="form"><div class="row"><label>Budget<input id="budget" type="number" min="1" required></label><label>Currency<select id="currency"><option>INR</option><option>USD</option><option>EUR</option></select></label></div><div><h3>Items</h3><div id="items" class="items"></div><button type="button" class="btn secondary" onclick="addItem()">+ Add item</button></div><button class="btn">Generate recommendations</button></form></div><div id="result"></div></main><script>requireAuth();function addItem(){items.insertAdjacentHTML('beforeend',`<div class="item-row"><select class="room"><option>Living Room</option><option>Bedroom</option><option>Kitchen</option><option>Dining Room</option><option>Study</option><option>Bathroom</option><option>Other</option></select><input class="item" placeholder="Item e.g. ceiling fan" required><input class="qty" type="number" min="1" value="1"><input class="style" placeholder="Style"><button type="button" class="btn secondary" onclick="this.parentElement.remove()">×</button></div>`)}addItem();homeForm.onsubmit=async e=>{e.preventDefault();try{const payload={budget:+budget.value,currency:currency.value,items:[...document.querySelectorAll('.item-row')].map(r=>({room:r.querySelector('.room').value,item:r.querySelector('.item').value,quantity:+r.querySelector('.qty').value,style:r.querySelector('.style').value||'Modern'})),priorities:[]};renderResult('#result',await api('/api/planners/home',{method:'POST',body:JSON.stringify(payload)}))}catch(x){result.innerHTML=`<p class="error">${escapeHtml(x.message)}</p>`}}</script>{% endblock %}
