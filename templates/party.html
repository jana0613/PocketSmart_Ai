{% extends 'base.html' %}{% block title %}Party Planner{% endblock %}{% block content %}<main class="container"><h1>Party Budget Planner</h1><div class="panel"><form id="partyForm" class="form"><div class="row"><label>Budget<input id="budget" type="number" min="1" required></label><label>Guests<input id="guests" type="number" min="1" required></label></div><div class="row"><label>Event type<input id="event_type" placeholder="Birthday, wedding, corporate" required></label><label>Venue<input id="venue" placeholder="Home, hall, outdoor" required></label></div><label>Date<input id="date" type="date"></label><label>Preferences<textarea id="preferences" placeholder="Vegetarian food, simple decor, etc."></textarea></label><button class="btn">Generate recommendations</button></form></div><div id="result"></div></main><script>requireAuth();partyForm.onsubmit=async e=>{e.preventDefault();try{let prefs=preferences.value.split(',').map(x=>x.trim()).filter(Boolean);renderResult('#result',await api('/api/planners/party',{method:'POST',body:JSON.stringify({budget:+budget.value,currency:'INR',event_type:event_type.value,guests:+guests.value,venue:venue.value,date:date.value||null,preferences:prefs})}))}catch(x){result.innerHTML=`<p class="error">${escapeHtml(x.message)}</p>`}}</script>{% endblock %}
