{% extends 'base.html' %}{% block title %}History{% endblock %}{% block content %}<main class="container"><h1>Recommendation History</h1><div class="panel" id="history">Loading...</div></main><script>requireAuth();(async()=>{try{let d=await api('/api/history');history.innerHTML=d.length?d.map(x=>`<div class="history-row"><span><b>${escapeHtml(x.planner)}</b><br><small>${new Date(x.created_at).toLocaleString()}</small></span><button class="btn" onclick='renderResult("#history",${JSON.stringify(x.result).replace(/</g,"\\u003c")})'>View</button></div>`).join(''):'<p>No recommendations yet.</p>'}catch(x){history.innerHTML=`<p class="error">${escapeHtml(x.message)}</p>`}})()</script>{% endblock %}
