{% extends 'base.html' %}{% block title %}Login{% endblock %}{% block content %}<main class="auth panel"><h1>Login</h1><form id="f" class="form"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" minlength="8" required></label><button class="btn">Login</button><div id="msg"></div></form><p>No account? <a href="/register">Register</a></p></main><script>f.onsubmit=async e=>{e.preventDefault();msg.textContent='';try{let d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});localStorage.setItem(tokenKey,d.access_token);location.href='/'}catch(x){msg.className='error';msg.textContent=x.message}}</script>{% endblock %}
