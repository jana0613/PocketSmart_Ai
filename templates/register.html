{% extends 'base.html' %}{% block title %}Register{% endblock %}{% block content %}<main class="auth panel"><h1>Create account</h1><form id="f" class="form"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" minlength="8" required></label><button class="btn">Register</button><div id="msg"></div></form><p>Already registered? <a href="/login">Login</a></p></main><script>f.onsubmit=async e=>{e.preventDefault();try{await api('/api/auth/register',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});location.href='/login'}catch(x){msg.className='error';msg.textContent=x.message}}</script>{% endblock %}
